services:
  walnutiq-ml-worker:
    build:
      context: ../..
      dockerfile: web-app/backend/Dockerfile
    container_name: walnutiq-ml-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - YOLO_CONFIG_DIR=/workspace/web-app/yolo/.ultralytics
      # Optional: set a secret token when exposing on VPS (e.g. ml-walnut.pinarlik.com)
      - ADMIN_WORKER_TOKEN=${ADMIN_WORKER_TOKEN:-}
    volumes:
      # Persist datasets, scraped images, training runs, and exported weights on the VPS host
      - ../yolo/datasets:/workspace/web-app/yolo/datasets
      - ../yolo/runs:/workspace/web-app/yolo/runs
      - ../yolo/dataset_builder/raw_scraped:/workspace/web-app/yolo/dataset_builder/raw_scraped
      - ../yolo/dataset_builder/curated:/workspace/web-app/yolo/dataset_builder/curated
      - ../yolo/dataset_builder/rejected_by_clip:/workspace/web-app/yolo/dataset_builder/rejected_by_clip
      - ../../weights:/workspace/weights

